<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
</head>
<body>
  <h2>Javascript Object Loop</h2>
  
  <div id="demo"> </div>
  
  <script>
    let person = {
      name: "Henry",
      age: 45,
      address: "New York"
    }
    
    let text = "";
    
    for (let x in person){
      text += person[x] + "<br>";
    }
    
    document.getElementById("demo").innerHTML = text;
    
  </script>
</body>
</html>
